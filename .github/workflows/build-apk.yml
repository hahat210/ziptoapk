name: ZIP to APK

on:
  push:
    paths:
      - 'config.json'
      - 'icon.png'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Build-tools ve platform indir
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.11.1 kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: |
          npm install -g cordova
          npm install

      - name: Releases üzerinden www.zip indir ve doğrula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GitHub Token kullanarak ZIP dosyası indiriliyor..."
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o www.zip "https://github.com/hahat210/ziptoapk/releases/download/Ssss/www.zip"
          
          echo "Dosya türü kontrol ediliyor:"
          file www.zip
          ls -lh www.zip
          
          echo "Header kontrolü:"
          head -c 50 www.zip || true
          
          if grep -q "<html" www.zip; then
            echo "HATA: İndirilen dosya hâlâ HTML sayfası!"
            exit 1
          fi

      - name: APK'yı derle
        run: node build.js

      - name: APK'yı yükle (indirilebilir çıktı)
        uses: actions/upload-artifact@v4
        with:
          name: apk-ciktisi
          path: output/*.apk
