Name: ZIP to APK

on:
  push:
    paths:
      - 'config.json'
      - 'icon.png'
      - 'build.js'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK paketlerini kur
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Cordova kur
        run: |
          npm install -g cordova@12.0.0
          cordova --version

      - name: Node bağımlılıklarını kur
        run: |
          npm install --no-audit --no-fund

      - name: Çoklu ZIP dosyalarını derle ve APK üret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          REPO="hahat210/ziptoapk"
          TAG="Ssss"
          
          mkdir -p output_all

          # www.zip ve www2.zip ile www10.zip arasındaki dosyaları döngüye alıyoruz
          for i in {1..10}; do
            if [ "$i" -eq 1 ]; then
              ZIP_NAME="www.zip"
              APP_NAME="Uygulama1"
            else
              ZIP_NAME="www${i}.zip"
              APP_NAME="Uygulama${i}"
            fi

            echo "========================================"
            echo "İşleniyor: $ZIP_NAME -> $APP_NAME"
            echo "========================================"

            # Belirli arşivi indir
            gh release download "$TAG" \
              --repo "$REPO" \
              --pattern "$ZIP_NAME" \
              --output target.zip \
              --clobber

            # Arşiv kontrolü
            unzip -t target.zip

            # build.js dosyasının bu zip dosyasını okuyacak şekilde ayarlı olduğunu varsayıyoruz
            # Eğer build.js sabit 'www.zip' arıyorsa, indirdiğimiz dosyayı target.zip yerine geçici olarak kopyalayabilirsin:
            cp target.zip www.zip

            # APK derle
            node build.js

            # Üretilen APK'yı bul ve yeniden adlandır
            FOUND_APK=$(find output -type f -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              cp "$FOUND_APK" "output_all/${APP_NAME}.apk"
              echo "$APP_NAME başarıyla derlendi ve kaydedildi."
            else
              echo "HATA: $APP_NAME için APK bulunamadı!"
              exit 1
            fi
            
            # Temizlik
            rm -f target.zip www.zip
            rm -rf output/*
          done

      - name: Tüm APK'ları kontrol et
        run: |
          echo "Üretilen Tüm APK'lar:"
          ls -lh output_all/

      - name: APK'ları Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: tum-uygulamalar-apk
          path: output_all/*.apk
          if-no-files-found: error
