name: ZIP to APK

on:
  push:
    paths:
      - 'config.json'
      - 'icon.png'
      - 'build.js'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK paketlerini kur
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Cordova kur
        run: |
          npm install -g cordova@12.0.0
          cordova --version

      - name: Node bağımlılıklarını kur
        run: |
          npm install --no-audit --no-fund

      - name: www.zip indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Ssss release aranıyor..."

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/hahat210/ziptoapk/releases/tags/Ssss" \
            -o release.json

          ASSET_ID=$(python3 - <<'PY'
          import json

          with open("release.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for asset in data.get("assets", []):
              if asset.get("name") == "www.zip":
                  print(asset["id"])
                  break
          PY
          )

          if [ -z "$ASSET_ID" ]; then
            echo "HATA: Ssss release içinde www.zip bulunamadı."
            echo "Release assetleri:"
            python3 - <<'PY'
          import json

          with open("release.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for asset in data.get("assets", []):
              print("-", asset.get("name"))
          PY
            exit 1
          fi

          echo "www.zip Asset ID: $ASSET_ID"

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o www.zip \
            "https://api.github.com/repos/hahat210/ziptoapk/releases/assets/$ASSET_ID"

          rm -f release.json

          echo "Dosya bilgisi:"
          ls -lh www.zip
          file www.zip

          echo "ZIP testi:"
          unzip -t www.zip

      - name: APK derle
        run: |
          node build.js

      - name: APK kontrol
        run: |
          echo "Üretilen APK:"
          find output -type f -name "*.apk" -ls

          test -n "$(find output -type f -name '*.apk')"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: apk-ciktisi
          path: output/*.apk
          if-no-files-found: error
