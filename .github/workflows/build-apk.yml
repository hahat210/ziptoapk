name: ZIP to APK

on:
  push:
    paths:
      - 'config.json'
      - 'icon.png'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Build-tools ve platform indir
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.11.1 kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: |
          npm install -g cordova
          npm install

      - name: GitHub API ile www.zip indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Release ID bulunuyor..."
          # Ssss tag'ine ait release bilgilerini çekip www.zip asset ID'sini alıyoruz
          ASSET_ID=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/hahat210/ziptoapk/releases/tags/Ssss" | grep -A 5 "www.zip" | grep "id\b" | head -n 1 | tr -dc '0-9')
          
          echo "Bulunan Asset ID: $ASSET_ID"
          
          if [ -z "$ASSET_ID" ]; then
            echo "HATA: www.zip asset ID bulunamadı!"
            exit 1
          fi
          
          echo "Zip dosyası API üzerinden indiriliyor..."
          curl -L -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" -o www.zip "https://api.github.com/repos/hahat210/ziptoapk/releases/assets/$ASSET_ID"
          
          echo "Dosya boyutu ve türü:"
          ls -lh www.zip
          file www.zip
          
          if grep -q "<html" www.zip; then
            echo "HATA: Dosya hâlâ HTML!"
            exit 1
          fi

      - name: APK'yı derle
        run: node build.js

      - name: APK'yı yükle (indirilebilir çıktı)
        uses: actions/upload-artifact@v4
        with:
          name: apk-ciktisi
          path: output/*.apk
