name: ZIP to APK

on:
  push:
    paths:
      - 'config.json'
      - 'icon.png'
      - 'build.js'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK paketlerini kur
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Cordova kur
        run: |
          npm install -g cordova@12.0.0
          cordova --version

      - name: Node bağımlılıklarını kur
        run: |
          npm install --no-audit --no-fund

      - name: Dinamik ZIP tespiti, Package adı güncellemesi ve APK derleme
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          REPO="hahat210/ziptoapk"
          TAG="Ssss"
          
          mkdir -p output_all

          echo "========================================"
          echo "Release içindeki www*.zip dosyaları listeleniyor..."
          echo "========================================"

          # Release'deki tüm varlıkları al ve www ile başlayıp .zip ile bitenleri filtrele
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -E '^www[0-9]*\.zip$')

          echo "Bulunan ZIP dosyaları:"
          echo "$ASSETS"

          COUNTER=1
          for ZIP_NAME in $ASSETS; do
            APP_NAME="Uygulama${COUNTER}"
            
            echo ""
            echo "----------------------------------------"
            echo "İşleniyor ($COUNTER): $ZIP_NAME -> $APP_NAME"
            echo "----------------------------------------"

            # Arşivi indir
            gh release download "$TAG" \
              --repo "$REPO" \
              --pattern "$ZIP_NAME" \
              --output www.zip \
              --clobber

            # Doğrula
            unzip -t www.zip

            # Package adının çakışmaması için sonuna sayfa/numara ekleyelim 
            # (config.json veya Cordova config.xml içindeki package adına müdahale edebiliriz)
            if [ -f "config.json" ]; then
              echo "config.json güncelleniyor..."
              # Node ile config.json içindeki package/id değerinin sonuna numara ekliyoruz
              node -e '
                const fs = require("fs");
                let config = JSON.parse(fs.readFileSync("config.json", "utf8"));
                if (config.id || config.packageId || config.bundleId) {
                  let key = config.id ? "id" : (config.packageId ? "packageId" : "bundleId");
                  config[key] = config[key] + "'${COUNTER}'";
                }
                fs.writeFileSync("config.json", JSON.stringify(config, null, 2));
              '
            fi

            # APK derle
            node build.js

            # Üretilen APK'yı bul ve yeniden adlandır
            FOUND_APK=$(find output -type f -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              cp "$FOUND_APK" "output_all/${APP_NAME}.apk"
              echo "$APP_NAME başarıyla derlendi ve kaydedildi."
            else
              echo "HATA: $APP_NAME için APK bulunamadı!"
              exit 1
            fi
            
            # Sonraki döngü için temizlik (git değişikliklerini geri al ki config.json orijinal haline dönsün)
            git checkout config.json
            rm -f www.zip
            rm -rf output/*
            
            COUNTER=$((COUNTER + 1))
          done

      - name: Tüm APK'ları kontrol et
        run: |
          echo "Üretilen Tüm APK'lar:"
          ls -lh output_all/

      - name: APK'ları Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: tum-uygulamalar-apk
          path: output_all/*.apk
          if-no-files-found: error
