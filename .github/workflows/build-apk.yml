name: ZIP to APK

on:
  push:
    paths:
      - 'config.json'
      - 'icon.png'
      - 'build.js'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK paketlerini kur
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Cordova kur
        run: |
          npm install -g cordova@12.0.0
          cordova --version

      - name: Node bağımlılıklarını kur
        run: |
          npm install --no-audit --no-fund

      - name: Ssss release içindeki www.zip indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          REPO="hahat210/ziptoapk"
          TAG="Ssss"

          echo "========================================"
          echo "Release aranıyor: $TAG"
          echo "========================================"

          gh release view "$TAG" --repo "$REPO"

          echo ""
          echo "Asset indiriliyor: www.zip"

          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "www.zip" \
            --output www.zip \
            --clobber

          echo ""
          echo "========================================"
          echo "İndirilen dosya"
          echo "========================================"

          ls -lh www.zip
          file www.zip

          echo ""
          echo "ZIP doğrulanıyor..."

          unzip -t www.zip

          echo ""
          echo "ZIP içeriği:"
          unzip -l www.zip | head -80

          echo ""
          echo "www.zip başarıyla indirildi ve doğrulandı."

      - name: APK derle
        run: |
          node build.js

      - name: APK kontrol
        run: |
          echo "Üretilen APK:"
          find output -type f -name "*.apk" -ls

          test -n "$(find output -type f -name '*.apk')"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: apk-ciktisi
          path: output/*.apk
          if-no-files-found: error
